# Explicitly scoped Docker Desktop host gateway; local staging only.
worker_processes 1;
pid /tmp/fit-upstream-nginx.pid;
events { worker_connections 128; }
http {
    access_log off;
    server {
        listen 8181;
        server_name _;
        client_max_body_size 0;
        location = /fit-registry/v1/catalog {
            limit_except GET { deny all; }
            proxy_pass http://host.docker.internal:43181;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_redirect off;
            proxy_pass_request_headers off;
            proxy_set_header Host host.docker.internal;
            proxy_set_header Accept application/json;
            proxy_set_header Accept-Encoding identity;
        }
        location = /fit-registry/v1/catalog/page {
            limit_except GET { deny all; }
            proxy_pass http://host.docker.internal:43181;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_redirect off;
            proxy_pass_request_headers off;
            proxy_set_header Host host.docker.internal;
            proxy_set_header Accept application/json;
            proxy_set_header Accept-Encoding identity;
        }
        location ~ "^/fit-registry/v1/releases/[a-z][a-z0-9.-]{1,120}/[0-9]{1,8}\.[0-9]{1,8}\.[0-9]{1,8}(?:-[0-9A-Za-z.-]{1,40})?$" {
            limit_except GET { deny all; }
            proxy_pass http://host.docker.internal:43181;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_redirect off;
            proxy_pass_request_headers off;
            proxy_set_header Host host.docker.internal;
            proxy_set_header Accept application/json;
            proxy_set_header Accept-Encoding identity;
        }
        location / { return 404; }
    }
}
