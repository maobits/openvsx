# STORE-FIT-PREVIEW-01: localhost-only read-only catalog preview. Not production IAM.
services:
  fit-upstream:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./fit-upstream.nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - private
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8181/fit-registry/v1/catalog/page?limit=1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fit-loopback:
    image: nginx:stable-alpine
    restart: unless-stopped
    network_mode: service:server
    depends_on:
      server:
        condition: service_healthy
        restart: true
      fit-upstream:
        condition: service_healthy
    volumes:
      - ./fit-loopback.nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:43181/fit-registry/v1/catalog/page?limit=1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    environment:
      # Exact canonical Spring property key; no ambiguous environment variable mapping.
      SPRING_APPLICATION_JSON: '{"blackwhi":{"store":{"fit-registry":{"origin":"http://127.0.0.1:43181"}}}}'
