# Shares Spring container's network namespace. Only localhost:43181 listens.
worker_processes 1;
pid /tmp/fit-loopback-nginx.pid;
events { worker_connections 128; }
http {
    access_log off;
    server {
        listen 127.0.0.1:43181;
        server_name _;
        location = /__fit_preview_health { return 200 "ok"; }
        location /fit-registry/ {
            limit_except GET { deny all; }
            proxy_pass http://fit-upstream:8181;
            proxy_connect_timeout 2s;
            proxy_read_timeout 6s;
            proxy_redirect off;
            proxy_pass_request_headers off;
            proxy_set_header Host fit-upstream;
            proxy_set_header Accept application/json;
            proxy_set_header Accept-Encoding identity;
        }
        location / { return 404; }
    }
}
